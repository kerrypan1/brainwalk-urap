# Double-visit (team-aligned) data definition: FW only, BOTH visits per participant,
# n = 46 x 2 - 1 = 91. Adopted to align with teammate (Kerry), who uses both visits;
# BW-0271 visit 2 is excluded (camera angle unlike every other recording), so one
# participant contributes a single visit. Grouping stays participant-level
# (StratifiedGroupKFold via the teammate bootstrap npz): both visits of a participant
# always fall in the same fold, so no leakage. The npz stores 46 PARTICIPANT indices,
# and the per-fold bootstrap expands each drawn participant to all their rows — so it
# needs NO regeneration. Target fga_estimate_score is the clinician's FGA estimated
# score on a 0-3 ordinal scale (each visit keeps its own score; never merged).
# task: regression = the ordinal view (mord.LogisticAT + MAE-aligned regressors).
experiment_name: fga_fw_2visit
random_seed: 42
task: regression

data:
  features: data/2026_05_17_FWOnly_2visits_features.csv
  labels: data/2026_05_17_FWOnly_2visits_labels.csv
  data_file: null
  id_col: sample_id
  target: fga_estimate_score
  visit: all
  exclude_sample_ids:
    - BW-0271_2   # 2025-04-21, camera angle not comparable to the rest

cv:
  strategy: bootstrap_aligned
  n_splits: 5
  bootstrap_npz: data/bootstrap_indices.npz
  use_bootstrap_folds: true

model:
  tune: grid
  tune_splits: 3

feature_selection:
  method: none
  rfecv_min_features: 5
  rfecv_step: 1
  features_json: null

reporting:
  ci_alpha: 0.05
  participant_level: false  # sample-level is the reported metric; see rule 4
