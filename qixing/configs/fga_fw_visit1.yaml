# THE study data definition (finalised 2026-07-24): FW only, visit 1 only, one
# sample per participant, n = 46. Target fga_estimate_score is the clinician's
# FGA *estimated score* on a 0-3 ordinal scale (not a 0-30 FGA total).
# Outer folds come from the teammate bootstrap npz (Kerry's participant grouping);
# inner 3-fold grid search selects hyperparameters on outer-train only.
experiment_name: fga_fw_visit1
random_seed: 42
task: regression

data:
  features: data/2026_05_17_FWOnly_2visits_features.csv
  labels: data/2026_05_17_FWOnly_2visits_labels.csv
  data_file: null
  id_col: sample_id
  target: fga_estimate_score
  visit: 1

cv:
  strategy: bootstrap_aligned
  n_splits: 5
  bootstrap_npz: data/bootstrap_indices.npz
  use_bootstrap_folds: true

model:
  tune: grid
  tune_splits: 3

feature_selection:
  method: none
  rfecv_min_features: 5
  rfecv_step: 1
  features_json: null

reporting:
  ci_alpha: 0.05
  participant_level: false  # sample-level is the reported metric; see rule 4
